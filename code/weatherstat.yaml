esphome:
  name: weatherstat
  friendly_name: weatherstat

esp32:
  board: esp32dev
  framework:
    type: arduino


# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "1jMWQU5upHFOSsau7648DkHP1Jtl0ZQv9BIFX6xRODI="

light:
- platform: neopixelbus
  type: GRB
  variant: WS2812
  pin: 23
  num_leds: 1        # <-- change to your LED count
  name: "WS2812B Strip"
  method: esp32_rmt   # REQUIRED for ESP-IDF

uart:
  id: uart_pms
  rx_pin: GPIO22   # PMS5003 TX
  tx_pin: GPIO2    # PMS5003 RX (optional)
  baud_rate: 9600

sensor:
  - platform: adc
    pin: 35
    name: "CO2 Sensor (Analog)"
    attenuation: 11db
    update_interval: 2s
    filters:
      - multiply: 3.3
      - calibrate_linear:
          - 0.4 -> 400
          - 2.0 -> 5000
    unit_of_measurement: "ppm"

  - platform: pmsx003
    type: PMSX003
    uart_id: uart_pms
    pm_1_0:
      name: "PM1.0"
    pm_2_5:
      name: "PM2.5"
    pm_10_0:
      name: "PM10"
    update_interval: 30s
ota:
  - platform: esphome
    password: "123104f93f2be837ac4baf32ac84cf4d"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Weatherstat Fallback Hotspot"
    password: "e2dRvPe49NrA"

captive_portal:



